name: Build MP3 library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'producer-space-cc0-sample-library.zip'
      - '.github/workflows/build-mp3-library.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MIDI renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fluidsynth fluid-soundfont-gm ffmpeg unzip
      - name: Extract and convert every MIDI file
        shell: bash
        run: |
          set -e
          rm -rf midi-mp3 /tmp/samplelib
          mkdir -p midi-mp3 /tmp/samplelib
          unzip -q producer-space-cc0-sample-library.zip -d /tmp/samplelib
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#/tmp/samplelib/}"
            base="$(basename "$f")"
            stem="${base%.*}"
            hash="$(printf '%s' "$rel" | sha256sum | cut -c1-10)"
            safe="$(printf '%s' "$stem" | sed 's/[^A-Za-z0-9._-]/_/g')"
            out="midi-mp3/${safe}-${hash}.mp3"
            wav="/tmp/${safe}-${hash}.wav"
            if fluidsynth -ni -F "$wav" -r 44100 /usr/share/sounds/sf2/FluidR3_GM.sf2 "$f" >/dev/null 2>&1; then
              if ffmpeg -y -loglevel error -i "$wav" -codec:a libmp3lame -q:a 2 "$out"; then count=$((count+1)); fi
            fi
            rm -f "$wav"
          done < <(find /tmp/samplelib -type f \( -iname '*.mid' -o -iname '*.midi' \) -print0)
          find midi-mp3 -type f -name '*.mp3' -printf '%f\n' | sort > midi-mp3/index.txt
          echo "Converted $count MIDI files"
          test "$count" -gt 0
      - name: Commit one-folder MP3 library
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midi-mp3
          if git diff --cached --quiet; then
            echo 'No MP3 changes'
          else
            git commit -m 'V7.1: build complete MP3 library'
            git push
          fi